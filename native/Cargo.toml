[package]
name = "apolloon-native"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:rune", "dep:libc", "dep:windows-sys"]

[dependencies]
rune = { path = "vendor/rune", optional = true, default-features = false, features = [
  "embedded-fonts",
  "accessibility",
  "tooling",
  "svg",
  "webgl",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
encoding_rs = "0.8"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
qrcodegen = "1.8"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rune = { path = "vendor/rune", optional = true, default-features = false, features = ["native-file-dialog"] }
fs2 = "0.4"
if-addrs = "0.15"
hostname = "0.4"
socket2 = "0.6"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = { version = "0.45", default-features = false }
csv = "1"
calamine = { version = "0.38", features = ["dates"] }
rust_xlsxwriter = "0.102"
tower-http = { version = "0.6", features = ["fs"] }
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "~30.0.1", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "History",
  "Document",
  "HtmlInputElement",
  "File",
  "FileList",
  "Blob",
  "Event",
  "HtmlElement",
  "Element",
  "Node",
  "Storage",
  "MediaQueryList",
] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
debug = 0

# Rune's upstream patches are required by its text and platform backends.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
winit = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "55ef5268f22038a95344b3e9d2b4a25ddba731b1" }
