name: Build App

# Pull requests verify installers; tagged releases distribute them.
# The slow parts run side by side on their own machines; "All checks" waits for all of them.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops the run for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  integration:
    name: Integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run test:e2e

  browser:
    name: Browser checks (${{ matrix.shard }}/2)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- --shard=${{ matrix.shard }}/2

  # The release runs these on Windows too; find a Windows-only failure here first.
  windows-tests:
    name: Unit tests on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm test

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build Windows app
        run: npm run electron:build:win

      - name: Smoke test Windows package
        run: node scripts/package-smoke.mjs

      # The Windows-only paths: Beheer › Systeem reads the network profile through PowerShell
      # while the packaged app leads a second laptop.
      - name: Open Beheer › Systeem in the packaged app
        run: node scripts/package-system-ui.mjs

      - name: Check the installer opens and closes the firewall
        run: node scripts/package-firewall.mjs

  build-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build Linux app
        run: npm run electron:build:linux

      - name: Smoke test Linux AppImage
        run: xvfb-run -a node scripts/package-smoke.mjs

  # The one check the main branch requires, so jobs can be added or renamed without touching
  # the repository rules. It runs even when a job fails, and fails with it.
  all-checks:
    name: All checks
    if: always()
    needs: [checks, integration, browser, windows-tests, build-windows, build-linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Fail when a job failed, was cancelled or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
