name: Build App

# Pull requests verify installers; tagged releases distribute them.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  tests:
    name: Typecheck, lint, unit, integration and browser tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --include=optional

      # The release runs these on Windows too; find a Windows-only failure here first.
      - name: Run regression tests
        run: npm test

      - name: Build Windows app
        run: npm run electron:build:win

      - name: Smoke test Windows package
        run: node scripts/package-smoke.mjs

      - name: Keep the unpacked app for the Windows system check
        uses: actions/upload-artifact@v7
        with:
          name: windows-unpacked
          path: release/win-unpacked
          retention-days: 1
          if-no-files-found: error

  # The Windows-only paths: Beheer › Systeem reads the network profile through PowerShell
  # while the packaged app leads a second laptop.
  windows-system-ui:
    name: Windows Beheer › Systeem
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Only Playwright is needed here; the packaged app brings its own Electron.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Get the unpacked app
        uses: actions/download-artifact@v8
        with:
          name: windows-unpacked
          path: release/win-unpacked

      - name: Open Beheer › Systeem in the packaged app
        run: node scripts/package-system-ui.mjs

  build-linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build Linux app
        run: npm run electron:build:linux

      - name: Smoke test Linux AppImage
        run: xvfb-run -a node scripts/package-smoke.mjs

  required-ci:
    name: Required CI
    if: always()
    needs: [tests, build-windows, windows-system-ui, build-linux]
    runs-on: ubuntu-26.04
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success,success'
