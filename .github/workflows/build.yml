name: Build App

# Pull requests verify installers; tagged releases distribute them.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  tests:
    name: Typecheck, lint, unit, integration and browser tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build Windows app
        run: npm run electron:build:win

      - name: Smoke test Windows package
        run: node scripts/package-smoke.mjs

  build-linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Build Linux app
        run: npm run electron:build:linux

      - name: Smoke test Linux AppImage
        run: xvfb-run -a node scripts/package-smoke.mjs

  required-ci:
    name: Required CI
    if: always()
    needs: [tests, build-windows, build-linux]
    runs-on: ubuntu-26.04
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success'
