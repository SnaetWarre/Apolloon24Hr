name: Build App

# Pull requests verify installers; tagged releases distribute them.
# The slow parts run side by side on their own machines; "All checks" waits for all of them.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops the run for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Check release and Wrapped tools
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  native:
    name: Native tests and browser check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev xdotool xvfb xauth libxkbcommon-x11-0 mesa-vulkan-drivers
      - name: Install wasm-bindgen CLI matching native/Cargo.lock
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: npm ci
      - run: npm run test:native
      - run: bash native/scripts/build-web.sh
      - run: cargo build --locked --manifest-path native/Cargo.toml --bin apolloon-native
      - run: npx playwright install --with-deps chromium
      - run: node native/scripts/check-web.mjs
      - run: node native/scripts/check-web.mjs --cpu
      - run: node native/scripts/check-failover.mjs
      - name: Recover crashed and frozen Timing windows while the server stays online
        run: |
          timeout 60s xvfb-run -a -s "-screen 0 1366x768x24" bash native/scripts/check-renderer-recovery.sh KILL
          timeout 60s xvfb-run -a -s "-screen 0 1366x768x24" bash native/scripts/check-renderer-recovery.sh STOP

  packages:
    uses: ./.github/workflows/native-packages.yml

  # The one check the main branch requires, so jobs can be added or renamed without touching
  # the repository rules. It runs even when a job fails, and fails with it.
  all-checks:
    name: All checks
    if: always()
    needs: [tools, native, packages]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Fail when a job failed, was cancelled or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
