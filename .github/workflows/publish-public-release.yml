name: Publish public release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published native tag to copy, such as native-v6.0.0
        required: true

permissions:
  contents: read

concurrency:
  group: public-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
  PUBLIC_REPO: SnaetWarre/apolloon-releases

jobs:
  publish:
    if: startsWith(inputs.tag || github.event.release.tag_name, 'native-v') && !github.event.release.prerelease
    runs-on: ubuntu-26.04
    environment: public-releases
    steps:
      - name: Download and verify the published packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          metadata=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,body)
          jq -e '.isDraft == false and .isPrerelease == false' <<< "$metadata"
          jq -r .body <<< "$metadata" > notes.md
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern 'apolloon-native-*' --pattern SHA256SUMS.txt
          cd assets
          sha256sum --check --strict SHA256SUMS.txt
          for file in apolloon-native-{windows.zip,windows-setup.exe,macos.tar.gz,macos.dmg,linux.tar.gz}; do
            test -s "$file"
          done

      - name: Publish to the public update feed
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$PUBLIC_REPO" --draft \
              --title "Apolloon Telsysteem ${RELEASE_TAG#native-v}" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" assets/* --repo "$PUBLIC_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$PUBLIC_REPO" --draft=false --latest=false --notes-file notes.md
