name: Deploy VPS

concurrency:
  group: apolloon-production
  cancel-in-progress: false

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_APP_DIR: ${{ vars.VPS_APP_DIR }}
      VPS_DATA_DIR: ${{ vars.VPS_DATA_DIR }}
      VPS_SERVICE_NAME: ${{ vars.VPS_SERVICE_NAME }}
      VPS_APP_PORT: ${{ vars.VPS_APP_PORT }}
      VPS_PUBLIC_HOST: ${{ vars.VPS_PUBLIC_HOST }}
      VPS_PUBLIC_APP_PORT: ${{ vars.VPS_PUBLIC_APP_PORT }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Binaryen for the web bundle
        run: npm install --global binaryen@130.0.0
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build and check the Rust server package
        run: |
          bash native/scripts/build-web.sh
          cargo build --release --locked --manifest-path native/Cargo.toml --no-default-features
          mkdir package
          cp native/target/release/apolloon-native package/
          cp -R native/web-dist package/
          python3 native/scripts/check-package.py package/apolloon-native
          tar -czf "$RUNNER_TEMP/apolloon-vps.tar.gz" -C package apolloon-native web-dist
          echo "DEPLOY_ARTIFACT=$RUNNER_TEMP/apolloon-vps.tar.gz" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "${VPS_SSH_PRIVATE_KEY}" ]; then
            echo "Missing secret VPS_SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          if [ -z "${VPS_KNOWN_HOSTS}" ]; then
            echo "Missing production secret VPS_KNOWN_HOSTS" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  BatchMode yes\n' > ~/.ssh/config

      - name: Deploy to VPS
        run: bash scripts/deploy-vps.sh
