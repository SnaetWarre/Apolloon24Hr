name: Release

on:
  push:
    tags: ['native-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      number: ${{ steps.verify.outputs.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify the version and generate release notes
        id: verify
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' native/Cargo.toml)
          RELEASE_TAG="$GITHUB_REF_NAME" node scripts/verify-release-tag.mjs "$version"
          node scripts/release-notes.mjs "$version" > notes.md
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  packages:
    needs: version
    uses: ./.github/workflows/native-packages.yml
    with:
      version: ${{ needs.version.outputs.number }}

  draft:
    needs: [version, packages]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: apolloon-native-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: native-sha256sums
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create or update the draft
        run: |
          sha256sum --check --strict SHA256SUMS.txt
          files=(apolloon-native-* SHA256SUMS.txt)
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --draft --latest=false \
              --title "Apolloon Telsysteem $RELEASE_VERSION" --notes-file notes.md
          fi
