name: Release

# A version tag builds, tests and smoke-tests the installers, attaches them to a draft
# release with that version's changelog, and adds SHA256SUMS.txt once every build is in.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, such as v4.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    runs-on: ubuntu-26.04
    steps:
      # Keep the generator from this workflow's revision: older tags do not contain it.
      - uses: actions/checkout@v6

      - name: Keep the release-note generator
        run: cp scripts/release-notes.mjs "${RUNNER_TEMP}/release-notes.mjs"

      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify tag matches package version
        run: node scripts/verify-release-tag.mjs

      - name: Create draft release with the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node "${RUNNER_TEMP}/release-notes.mjs" > "${RUNNER_TEMP}/notes.md"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --verify-tag \
              --title "Apolloon Telsysteem ${RELEASE_TAG#v}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
          fi

  build:
    needs: prepare-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: electron:build:win
            assets: release/*.exe
            smoke: node scripts/package-smoke.mjs
          - name: Linux x64
            os: ubuntu-26.04
            script: electron:build:linux
            assets: release/*.AppImage
            smoke: xvfb-run -a node scripts/package-smoke.mjs
          - name: macOS Apple Silicon
            os: macos-latest
            script: electron:build:mac
            assets: release/*.dmg release/*.zip
            smoke: ''

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/electron
            ${{ runner.temp }}/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Install dependencies
        run: npm ci --include=optional
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder

      - name: Run regression tests
        run: npm test

      - name: Build desktop package
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_CACHE: ${{ runner.temp }}/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder

      # The same checks as on pull requests: the packaged app starts, opens old databases and backs up.
      - name: Smoke test the package
        if: matrix.smoke != ''
        run: ${{ matrix.smoke }}

      - name: Upload installers to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.assets }})
          if (( ${#files[@]} == 0 )); then
            echo "No release files matched: ${{ matrix.assets }}" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber

  checksums:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Add SHA256SUMS.txt for every installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "${RELEASE_TAG}" --pattern '*.exe' --pattern '*.AppImage' --pattern '*.dmg' --pattern '*.zip'
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${RELEASE_TAG}" SHA256SUMS.txt --clobber
