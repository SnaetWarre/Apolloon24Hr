<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Setup - Leuven 24h Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .setup-box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      margin: 0 0 10px 0;
      color: #333;
      font-size: 24px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #5568d3;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .error {
      color: #e74c3c;
      font-size: 14px;
      margin-top: -10px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="setup-box">
    <h1>Welcome to Leuven 24h Tracker</h1>
    <p>Set your admin password to get started</p>
    
    <form id="setupForm">
      <label for="password">Admin Password</label>
      <input type="password" id="password" required minlength="4" placeholder="Enter admin password">
      
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" required minlength="4" placeholder="Confirm password">
      
      <div id="error" class="error"></div>
      
      <button type="submit" id="submitBtn">Start Application</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('setupForm');
    const error = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        error.textContent = 'Passwords do not match';
        return;
      }

      if (password.length < 4) {
        error.textContent = 'Password must be at least 4 characters';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      try {
        const response = await fetch('http://localhost:31337/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        if (response.ok) {
          window.location.href = 'http://localhost:5173';
        } else {
          error.textContent = 'Setup failed. Please try again.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Start Application';
        }
      } catch (err) {
        error.textContent = 'Could not connect to server';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Start Application';
      }
    });
  </script>
</body>
</html>
