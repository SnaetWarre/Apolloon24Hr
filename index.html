<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apolloon telsysteem</title>
    <script>
      // Apply the operator theme before first paint (see src/app/theme.ts). Public displays own their look.
      (function () {
        var root = document.documentElement;
        if (location.pathname.indexOf('/display/') === 0) {
          var requested = new URLSearchParams(location.search).get('thema');
          var tone = requested === 'licht' ? 'light' : requested === 'donker' ? 'dark'
            : location.pathname.indexOf('/display/outside') === 0 ? 'light' : 'dark';
          root.setAttribute('data-surface', 'display');
          root.setAttribute('data-display-tone', tone);
          return;
        }
        var preference = 'system';
        try {
          var stored = localStorage.getItem('apolloon.theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
        } catch (error) {}
        var theme = preference === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference;
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-theme-preference', preference);
        root.style.colorScheme = theme;
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100vh; background: #F3F5F8; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #0A1119; }
      html[data-surface="display"], html[data-surface="display"] body { background: #070D14; }
      html[data-display-tone="light"], html[data-display-tone="light"] body { background: #FFFFFF; }
      #root { min-height: 100vh; }
    </style>
    <link rel="preload" as="image" href="/brand/apolloon-logo.png" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-latin-400-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-condensed-latin-700-normal.woff2" crossorigin />
    <script>
      window.__APOLLOON_STATE_PROMISE__ = fetch('/api/state').then(function (response) {
        if (!response.ok) throw new Error('Serverstatus laden mislukt (' + response.status + ')');
        return response.json();
      });
      window.__APOLLOON_STATE_PROMISE__.catch(function () {});
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
