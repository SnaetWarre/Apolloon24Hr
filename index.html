<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apolloon Telsysteem</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the operator theme before first paint (see src/app/theme.ts). Public displays own their look.
      (function () {
        var root = document.documentElement;
        // Inside the desktop app the page draws its own title bar (src/styles/titlebar.css).
        if (window.apolloonDesktop) root.setAttribute('data-desktop', window.apolloonDesktop.platform || '');
        if (location.pathname.indexOf('/display/') === 0) {
          var requested = new URLSearchParams(location.search).get('thema');
          var display = location.pathname.indexOf('/display/outside') === 0 ? 'outside' : 'inside';
          var stored = null;
          try { stored = localStorage.getItem('apolloon.display.' + display); } catch (error) {}
          var tone = requested === 'licht' ? 'light' : requested === 'donker' ? 'dark'
            : stored === 'light' || stored === 'dark' ? stored
            : display === 'outside' ? 'light' : 'dark';
          root.setAttribute('data-surface', 'display');
          root.setAttribute('data-display-tone', tone);
          return;
        }
        var theme = null;
        try {
          var stored = localStorage.getItem('apolloon.theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (error) {}
        // Without a stored choice, the first load follows the operating system.
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.setAttribute('data-theme', theme);
        root.setAttribute('data-theme-preference', theme);
        root.style.colorScheme = theme;
      })();
    </script>
    <style>
      html, body { margin: 0; min-height: 100vh; background: #F7F7F8; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #1A1A1A; }
      html[data-surface="display"], html[data-surface="display"] body { background: #111111; }
      html[data-display-tone="light"], html[data-display-tone="light"] body { background: #FFFFFF; }
      #root { min-height: 100vh; }
    </style>
    <link rel="preload" as="image" href="/brand/apolloon-logo.png" fetchpriority="high" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/geist-latin-wght-normal.woff2" crossorigin />
    <script>
      window.__APOLLOON_STATE_PROMISE__ = fetch('/api/state').then(function (response) {
        if (response.ok) return response.json();
        return response.json().then(
          function (body) { return body && body.error; },
          function () { return null; }
        ).then(function (reason) {
          throw new Error('Serverstatus laden mislukt (' + response.status + ')' + (reason ? ': ' + reason : ''));
        });
      });
      window.__APOLLOON_STATE_PROMISE__.catch(function () {});
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
