<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apolloon telsysteem</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background: #f5f7fb;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        min-height: 100vh;
      }
    </style>
    <link rel="preload" as="image" href="/brand/apolloon-logo.png" fetchpriority="high" />
    <script>
      window.__APOLLOON_STATE_PROMISE__ = fetch('/api/state').then(function (response) {
        if (!response.ok) throw new Error('Serverstatus laden mislukt (' + response.status + ')');
        return response.json();
      });
      window.__APOLLOON_STATE_PROMISE__.catch(function () {});
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
